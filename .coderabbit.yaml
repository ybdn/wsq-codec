# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit settings for wsq-codec. This file overrides the app.coderabbit.ai UI.
# The repository has fewer than 10 stars, so reviews still start by hand:
# comment `@coderabbitai review` on the pull request (a bot comment does not count).
language: en-US

reviews:
  profile: assertive
  request_changes_workflow: false
  auto_review:
    enabled: true
    drafts: false
    # develop is the default branch; preprod and prod receive release PRs.
    base_branches:
      - "^develop$"
      - "^preprod$"
      - "^prod$"
    ignore_usernames:
      - "dependabot[bot]"
  path_filters:
    - "!**/*.wsq"
    - "!fuzz/seeds/**"
    - "!capi/include/wsq.h" # generated by cbindgen, CI fails on any difference
    - "!**/target/**"
  path_instructions:
    - path: "**"
      instructions: |
        wsq-codec is a public Rust WSQ codec aiming at FBI certification (IAFIS-IC-0110 v3.1),
        compatibility with every WSQ decoder, and measured superiority over NBIS 5.0.0.
        - Flag any real fingerprint, any file from NIST's certification test set, or any
          biometric data: only synthetic images are allowed (GDPR art. 9).
        - Flag any claim of being certified, faster, better or compatible that comes without a
          measurement or a test.
        - A user-visible change needs a line under `## Unreleased` in CHANGELOG.md.
        - MSRV is 1.85 (edition 2024): flag APIs or syntax that need a newer compiler,
          except under `certified/`, which uses its pinned toolchain.
    - path: "certified/**"
      instructions: |
        This is `wsq-certified`, the code an FBI certificate covers. Any change here, even a
        comment, is a new version to certify:
        - Require a `version` bump in certified/Cargo.toml, a section in certified/CHANGELOG.md
          and the exact pins `wsq-certified = { version = "=X.Y.Z" }` updated in Cargo.toml and
          cli/Cargo.toml (Markdown-only changes excepted).
        - Ask whether the change belongs here at all: the optimized encoder, bindings and
          integrations belong outside `certified/`.
        - The conformant encoder must stay byte-identical to NBIS (`certified/tests/nbis.rs`) and
          the decoder pixel-identical; flag any change to arithmetic order, single/double
          precision mix, bit allocation, quantization or Huffman table construction.
        - `#![forbid(unsafe_code)]` stays. Corrupt input must return an error, never panic,
          overflow or allocate without bound; allocations stay fallible.
        - Do not raise the toolchain in certified/rust-toolchain.toml without a new certification.
    - path: "certified/src/math.rs"
      instructions: |
        Platform-independent `ln` and `pow`: no libm, no `f64::ln`/`powf`/`mul_add`, nothing that
        lets the compiler fuse multiply-add (FMA). Results must be identical on every target
        (x86-64, aarch64, wasm32, s390x big-endian).
    - path: "certified/tests/data/**"
      instructions: |
        Fixtures are synthetic images encoded by NBIS 5.0.0 compiled with -ffp-contract=off.
        Flag real fingerprints, NIST test-set files, or references regenerated with another
        encoder.
    - path: "src/**"
      instructions: |
        Public API frozen at 1.0 (docs/api-1.0.md, checked by cargo-semver-checks): flag any
        breaking change. New public structs and enums are `#[non_exhaustive]`; new functions
        document their errors. No new dependency in the core crate (only the optional `image`
        feature). The `Optimized` profile may depart from NBIS but every output must stay readable
        by any WSQ decoder and must never write the FBI implementation number.
    - path: "{capi,python,wasm}/**"
      instructions: |
        Bindings use the public API of `wsq-codec` only. Check FFI soundness: null and length
        checks, no panic across the boundary, ownership of returned buffers. In capi/, a changed
        `extern "C"` item needs capi/include/wsq.h regenerated with cbindgen 0.29.4. In wasm/, the
        demo loads no external resource and keeps a same-origin-only Content-Security-Policy. In
        python/, PyO3 and numpy stay dependencies of `wsq-python` only.
    - path: "{bench,benches,fuzz}/**"
      instructions: |
        Benchmarks must check output identity before timing and report their method (confidence
        intervals, threads, inputs). benches/hashes.txt changing means encoded output changed:
        demand a justification. Fuzz targets must not hide panics behind catch_unwind.
    - path: ".github/workflows/**"
      instructions: |
        Actions pinned by full commit SHA with a version comment; minimal `permissions`; no
        `pull_request_target`, no secret exposed to pull requests from forks. Releases are
        published only from `v*` tags on `prod`, through Trusted Publishing (OIDC). Branch flow:
        feature branches → develop → preprod → prod.

chat:
  auto_reply: true
